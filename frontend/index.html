<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cadeweb-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CadêWeb - Prospecção Inteligente de Clientes</title>
    <script>
      (function() {
        try {
          var tema = localStorage.getItem('tema');
          var dark = tema === 'dark' || (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
