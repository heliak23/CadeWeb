# Configuração do electron-builder (empacotamento + auto-update do CadêWeb)
#
# Build local (sem publicar):   npm run dist
# Publicar release no GitHub:   npm run publicar   (precisa de GH_TOKEN no ambiente)

appId: com.cadeweb.app
productName: CadêWeb
icon: cadeweb.ico

directories:
  output: saida

files:
  - main.js
  # os dois preloads PRECISAM estar aqui: sem eles no pacote, a captura do
  # WhatsApp e os eventos do cockpit falham em silêncio no app instalado
  - preload-app.js
  - preload-whatsapp.js
  - package.json
  - cadeweb.ico

# o bundle do PyInstaller (backend + scraper + node + frontend) vai inteiro
# como recurso - main.js o sobe como sidecar
extraResources:
  - from: ../backend/dist/CadeWeb
    to: backend

win:
  target:
    - nsis
  signAndEditExecutable: false

afterPack: ./afterPack.js

nsis:
  # instalação por usuário, um clique, estilo VSCode - é o formato que o
  # electron-updater sabe atualizar sozinho
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false # NUNCA apagar %APPDATA%\CadeWeb (os leads!)
  artifactName: CadeWeb-Setup-${version}.${ext}
  shortcutName: CadêWeb

publish:
  provider: github
  owner: cadeweb
  repo: cadeweb
